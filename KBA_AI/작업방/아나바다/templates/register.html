{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
  <div class="card-body p-4">
    <h4 class="mb-4 text-center">회원가입</h4>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="username" class="form-label">사용자 이름</label>
        <input type="text" class="form-control" id="username" name="username" minlength="2" maxlength="20" required autofocus autocomplete="username" value="{{ username }}">
        <div class="form-text">2~20자</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">비밀번호</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" required autocomplete="new-password">
        <div class="form-text">6자 이상</div>
      </div>
      <div class="mb-3">
        <label for="password2" class="form-label">비밀번호 확인</label>
        <input type="password" class="form-control" id="password2" name="password2" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-success w-100">가입하기</button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">
      이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a>
    </p>
  </div>
</div>
{% endblock %}
